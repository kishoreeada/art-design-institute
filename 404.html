<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Stackly Arts Institute</title>
  <meta name="description" content="Page not found at Stackly Arts Institute.">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* ===== STACKLY 404 — SIMPLE, CENTERED, NO-SCROLL ===== */
    html, body{
      width:100%;
      height:100%;
      min-height:100%;
      margin:0;
      overflow:hidden !important;
    }

    body.stackly-404-page{
      min-height:100dvh;
      height:100dvh;
      background:#f4eee4;
      color:#17191b;
      overflow:hidden !important;
    }

    .stackly-404{
      width:100%;
      height:100dvh;
      min-height:100dvh;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 20px;
      overflow:hidden;
    }

    .stackly-404-inner{
      width:min(100%, 900px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .stackly-404-kicker{
      margin:0 0 20px;
      font-family:"Space Grotesk",Arial,sans-serif;
      font-size:clamp(11px,1vw,14px);
      line-height:1;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#fb5b00;
    }

    .stackly-404-title{
      margin:0;
      font-family:"DM Serif Display",Georgia,"Times New Roman",serif;
      font-size:clamp(76px,15vw,210px);
      line-height:.82;
      letter-spacing:-.065em;
      font-weight:400;
    }

    .stackly-404-subtitle{
      margin:24px 0 0;
      font-family:"Space Grotesk",Arial,sans-serif;
      font-size:clamp(16px,1.8vw,24px);
      line-height:1.2;
      font-weight:600;
      letter-spacing:-.02em;
    }

    .stackly-404-actions{
      margin-top:34px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .stackly-404-btn{
      min-width:190px;
      min-height:52px;
      padding:15px 24px;
      box-sizing:border-box;
      border:1px solid #17191b;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      cursor:pointer;
      font-family:"Space Grotesk",Arial,sans-serif;
      font-size:11px;
      line-height:1;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      transition:
        background-color .25s ease,
        color .25s ease,
        transform .25s ease,
        border-color .25s ease;
    }

    .stackly-404-btn-home{
      background:#17191b;
      color:#fffdf8;
    }

    .stackly-404-btn-previous{
      background:transparent;
      color:#17191b;
    }

    .stackly-404-btn:hover,
    .stackly-404-btn:focus-visible{
      background:#fb5b00;
      border-color:#fb5b00;
      color:#fffdf8;
      transform:translateY(-3px);
      outline:none;
    }

    .stackly-404-btn:active{
      transform:translateY(-1px);
    }

    @media (max-width:600px){
      .stackly-404{
        padding:24px 16px;
      }

      .stackly-404-title{
        font-size:clamp(72px,23vw,130px);
      }

      .stackly-404-subtitle{
        max-width:320px;
        font-size:16px;
      }

      .stackly-404-actions{
        width:100%;
        flex-direction:column;
        gap:10px;
        margin-top:28px;
      }

      .stackly-404-btn{
        width:min(100%,320px);
        min-height:50px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .stackly-404-btn{
        transition:none;
      }
    }
  </style>
</head>
<body class="stackly-404-page">
  <main class="stackly-404" aria-labelledby="error-title">
    <div class="stackly-404-inner">
      <p class="stackly-404-kicker">Stackly Arts Institute</p>
      <h1 class="stackly-404-title" id="error-title">404</h1>
      <p class="stackly-404-subtitle">404 NOT FOUND</p>

      <div class="stackly-404-actions">
        <a class="stackly-404-btn stackly-404-btn-home" href="index.html">GO TO HOME</a>
        <button class="stackly-404-btn stackly-404-btn-previous" type="button" id="previousPageBtn">PREVIOUS PAGE</button>
      </div>
    </div>
  </main>

  <script>
    document.getElementById("previousPageBtn").addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
